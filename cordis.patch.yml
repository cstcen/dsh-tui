# The dsh-tui bundle patch: an interactive terminal client over dsh-base.
#
# The profile boot composes bundle layers in `dsh.profile.bundles` order, so
# this layer lands after @deepseek-ai/dsh-base and only ADDS rows — the base
# already provides the session store, persistence (jsonl under $DSH_HOME/sessions),
# the agent registry, the default-model selection, and every tool.
#
# No Host, HTTP server, or browser plugin is mounted: this is the same core
# Agent/Session runner the headless profile drives, wrapped in a readline REPL
# with live event streaming (`session/event`), durable session resume, and
# graceful exit through the launcher's `appExit`.
#
# The tui-startup row parses the app flags (--resume / --workspace) and
# provides them as an ordinary service; the tui row injects that service and
# reads it from lazily resolved config expressions, mirroring the headless and
# web bundles' startup pattern.
- insert:
    - id: tui-startup
      name: 'dsh-tui/startup'

    - id: tui
      name: 'dsh-tui'
      inject: [tuiStartup]
      config:
        resumeSessionId: !!js ctx.tuiStartup.resumeSessionId ?? ''
        workspace: !!js ctx.tuiStartup.workspace
